name: Run SaleAlert Scraper Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: |
          python smart_scheduler.py

      - name: Commit and push updated deals feed
        run: |
          git config --global user.name "SaleAlert Bot"
          git config --global user.email "bot@salealert.com"
          git fetch origin main
          git pull origin main --rebase || true
          git add deals_feed.json
          git commit -m "Auto-update deals feed [skip ci]" || echo "No changes to commit"
          git push origin main
