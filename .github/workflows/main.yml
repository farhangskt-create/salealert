name: Run SaleAlert Scraper Daily

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: |
          python smart_scheduler.py

      - name: Commit and push updated deals feed
        run: |
          git config --global user.name "SaleAlert Bot"
          git config --global user.email "bot@salealert.com"
          git add deals_feed.json
          git commit -m "Auto-update deals feed [skip ci]" || echo "No changes to commit"
          git push
