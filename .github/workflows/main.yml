name: Run SaleAlert Scraper Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: |
          python smart_scheduler.py

      
      - name: Commit and push updated deals feed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "SaleAlert Bot"
          git config user.email "bot@salealert.com"

          cp deals_feed.json "$RUNNER_TEMP/deals_feed.json"

          git fetch origin main
          git reset --hard origin/main

          cp "$RUNNER_TEMP/deals_feed.json" deals_feed.json
          git add deals_feed.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Sync latest SaleAlert deals feed"
          git push origin HEAD:main
